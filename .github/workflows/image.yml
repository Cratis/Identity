name: CratisId image

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build hosted-shared image
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Docker/Dockerfile
          target: cratis-id
          build-args: HOST=Identity.CratisId
          push: false
          tags: cratis-id:ci

  publish:
    name: Publish hosted-shared image (opt-in)
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) &&
      vars.CRATIS_ID_IMAGE_PUBLISH_ENABLED == 'true'
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Docker/Dockerfile
          target: cratis-id
          build-args: HOST=Identity.CratisId
          push: true
          tags: |
            ghcr.io/cratis/id:${{ github.sha }}
            ghcr.io/cratis/id:${{ github.ref_type == 'tag' && github.ref_name || 'latest' }}
