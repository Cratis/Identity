name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and specs
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true

      # Keep NuGet packages on the runner's scratch volume beside the checkout, not on the node's small
      # ephemeral storage, where the kubelet evicts the runner under disk pressure.
      - name: Keep NuGet packages on the scratch volume
        shell: bash
        run: echo "NUGET_PACKAGES=$(dirname "$GITHUB_WORKSPACE")/.nuget-packages" >> "$GITHUB_ENV"

      # The runner cannot write the default /usr/share/dotnet, so install the SDK into the job's temp.
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x
            11.0.x
          dotnet-quality: preview

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Check vector baseline immutability
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: node scripts/check-vector-baseline-immutability.mjs

      - name: Vector tooling tests
        run: node --test scripts/package-authorization-vectors.test.mjs scripts/check-vector-baseline-immutability.test.mjs

      - name: Remove generated proxies before rebuilding
        shell: bash
        run: git grep -l "@generated by Cratis" -- Source/JavaScript/Identity | xargs -r rm

      - name: Build (Release, zero warnings)
        run: dotnet build Identity.slnx --configuration Release -warnaserror

      - name: Format
        run: dotnet format Identity.slnx --verify-no-changes --no-restore

      - name: Preserve released event schemas and fixtures
        shell: bash
        env:
          SCHEMA_EVENT: ${{ github.event_name }}
          SCHEMA_PR_BASE: ${{ github.base_ref }}
          SCHEMA_PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$SCHEMA_EVENT" in
            pull_request)
              git check-ref-format "refs/heads/$SCHEMA_PR_BASE"
              git fetch --no-tags origin "refs/heads/$SCHEMA_PR_BASE:refs/remotes/origin/$SCHEMA_PR_BASE"
              base_ref="origin/$SCHEMA_PR_BASE"
              ;;
            push)
              if [[ -z "$SCHEMA_PREVIOUS_SHA" || "$SCHEMA_PREVIOUS_SHA" == "0000000000000000000000000000000000000000" ]]; then
                echo "::notice::Released schema gate skipped: this push has no previous commit."
                exit 0
              fi
              if [[ ! "$SCHEMA_PREVIOUS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::Invalid previous commit for the released schema gate."
                exit 1
              fi
              base_ref="$SCHEMA_PREVIOUS_SHA"
              if ! git cat-file -e "$base_ref^{commit}"; then
                git fetch --no-tags origin "$base_ref"
              fi
              ;;
            *)
              echo "::error::Unsupported event for the released schema gate."
              exit 1
              ;;
          esac
          base_commit="$(git rev-parse --verify --end-of-options "$base_ref^{commit}")"
          baseline="Source/Identity.Contracts.Check/catalogue/event-schemas.json"
          if ! git cat-file -e "$base_commit:$baseline"; then
            # Only an absent tree entry is a bootstrap exemption, not an unreadable blob.
            baseline_entry="$(git ls-tree --full-tree "$base_commit" -- "$baseline")"
            if [[ -n "$baseline_entry" ]]; then
              echo "::error::The released schema baseline exists but could not be read."
              exit 1
            fi
            echo "::notice::Released schema gate bootstrap: the trusted base has no schema baseline yet; skipped."
            exit 0
          fi
          dotnet Source/Identity.Contracts.Check/bin/Release/net10.0/Cratis.Identity.Contracts.Check.dll --released-ref "$base_commit" Identity.slnx

      - name: Proxy generation produced output
        shell: bash
        run: |
          if git grep -l '\[Command\]\|\[ReadModel\]' -- Source/Identity > /dev/null; then
            if ! git grep -l '@generated by Cratis' -- Source/JavaScript/Identity > /dev/null; then
              echo "the proxy generator produced no proxies"
              exit 1
            fi
          fi

      - name: Unit specs
        run: ./Source/Identity.Specs/bin/Release/net11.0/Cratis.Identity.Specs

      - name: Integration specs
        run: ./Source/Identity.Integration.Specs/bin/Release/net11.0/Cratis.Identity.Integration.Specs -notrait "Category=Conformance"

      - name: Release gate - Chronicle-down behaviour
        run: ./Source/Identity.Integration.Specs/bin/Release/net10.0/Cratis.Identity.Integration.Specs -class Cratis.Identity.Integration.for_Revocation.when_chronicle_is_unavailable

      - name: Protocol conformance (RFCs)
        run: ./Source/Identity.Integration.Specs/bin/Release/net11.0/Cratis.Identity.Integration.Specs -trait "Category=Conformance"

      # CI builds and packs the packages as artifacts only. There is no publish step until the W0 specs (#24, #26, #27) lock.
      - name: Pack NuGet
        run: dotnet pack Identity.slnx --configuration Release --no-build --output Artifacts/NuGet -p:Version=0.0.0-ci.${{ github.run_number }}

      - name: Proxies are current
        shell: bash
        run: |
          # The generator stamps the build time in each header, so compare content only.
          if [ -n "$(git status --porcelain --untracked-files=all -- Source/JavaScript/Identity | grep -v '^ M')" ] || ! git diff --quiet -I'@generated by Cratis' -- Source/JavaScript/Identity; then
            git status --porcelain -- Source/JavaScript/Identity
            echo "The generated proxies are out of date. Build locally and commit them."
            exit 1
          fi
          proxy_count=$(find Source/JavaScript/Identity -type f -name '*.ts' -not -name index.ts -not -path '*/node_modules/*' | wc -l)
          if [ "$proxy_count" -eq 0 ]; then
            echo "No generated proxy files were found. Build locally and verify proxy generation."
            exit 1
          fi
          echo "Generated proxy file count: $proxy_count"

      - name: Pack npm
        working-directory: Source/JavaScript/Identity
        run: |
          npm ci
          npm run build
          mkdir -p ../../../Artifacts/npm
          npm pack --pack-destination ../../../Artifacts/npm

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: Artifacts/
          retention-days: 7
          if-no-files-found: error
