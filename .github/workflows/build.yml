name: Build

# Called from pull-requests.yml; the PR triggers and path filters live there.
on:
  push:
    branches: [main]
  schedule:
    - cron: "23 5 * * *"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: identity-build-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and specs
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      # Keep NuGet packages on the runner's scratch volume beside the checkout, not on the node's small
      # ephemeral storage, where the kubelet evicts the runner under disk pressure.
      - name: Keep NuGet packages on the scratch volume
        shell: bash
        run: echo "NUGET_PACKAGES=$(dirname "$GITHUB_WORKSPACE")/.nuget-packages" >> "$GITHUB_ENV"

      # The runner cannot write the default /usr/share/dotnet, so install the SDK into the job's temp.
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.x

      - name: Check vector baseline immutability
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
        run: |
          node scripts/check-vector-baseline-immutability.mjs
          node scripts/package-contract-vectors.mjs check

      - name: Vector tooling tests
        run: node --test scripts/package-authorization-vectors.test.mjs scripts/check-vector-baseline-immutability.test.mjs scripts/package-contract-vectors.test.mjs

      - name: Build (Release, zero warnings)
        run: dotnet build Identity.slnx --configuration Release -warnaserror -p:CratisProxiesSkip=true -p:CratisProxiesOutputPath=

      - name: Format
        run: dotnet format Identity.slnx --verify-no-changes --no-restore

      - name: Preserve released event schemas and fixtures
        shell: bash
        env:
          SCHEMA_EVENT: ${{ github.event_name }}
          SCHEMA_PR_BASE: ${{ github.base_ref }}
          SCHEMA_PREVIOUS_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$SCHEMA_EVENT" in
            pull_request)
              git check-ref-format "refs/heads/$SCHEMA_PR_BASE"
              # The full-history checkout already holds the base branch; the checkout keeps no
              # credentials, so a fetch here would fail against this private repository.
              base_ref="origin/$SCHEMA_PR_BASE"
              ;;
            push)
              if [[ -z "$SCHEMA_PREVIOUS_SHA" || "$SCHEMA_PREVIOUS_SHA" == "0000000000000000000000000000000000000000" ]]; then
                echo "::notice::Released schema gate skipped: this push has no previous commit."
                exit 0
              fi
              if [[ ! "$SCHEMA_PREVIOUS_SHA" =~ ^[0-9a-fA-F]{40}$ ]]; then
                echo "::error::Invalid previous commit for the released schema gate."
                exit 1
              fi
              base_ref="$SCHEMA_PREVIOUS_SHA"
              if ! git cat-file -e "$base_ref^{commit}"; then
                echo "::error::The previous commit is not in the full-history checkout (was the branch force-pushed?)."
                exit 1
              fi
              ;;
            schedule)
              base_ref="HEAD"
              ;;
            *)
              echo "::error::Unsupported event for the released schema gate."
              exit 1
              ;;
          esac
          base_commit="$(git rev-parse --verify --end-of-options "$base_ref^{commit}")"
          baseline="Source/Identity.Contracts.Check/catalogue/event-schemas.json"
          if ! git cat-file -e "$base_commit:$baseline"; then
            # Only an absent tree entry is a bootstrap exemption, not an unreadable blob.
            baseline_entry="$(git ls-tree --full-tree "$base_commit" -- "$baseline")"
            if [[ -n "$baseline_entry" ]]; then
              echo "::error::The released schema baseline exists but could not be read."
              exit 1
            fi
            echo "::notice::Released schema gate bootstrap: the trusted base has no schema baseline yet; skipped."
            exit 0
          fi
          dotnet Source/Identity.Contracts.Check/bin/Release/net10.0/Cratis.Identity.Contracts.Check.dll --released-ref "$base_commit" Identity.slnx
          dotnet Source/Identity.Contracts.Check/bin/Release/net11.0/Cratis.Identity.Contracts.Check.dll --released-ref "$base_commit" Identity.slnx

      - name: Unit specs
        run: |
          ./Source/Identity.Specs/bin/Release/net10.0/Cratis.Identity.Specs
          ./Source/Identity.Specs/bin/Release/net11.0/Cratis.Identity.Specs

      - name: Integration specs
        run: |
          ./Source/Identity.Integration.Specs/bin/Release/net10.0/Cratis.Identity.Integration.Specs -notrait "Category=Conformance" -longRunning 60 -reporter verbose
          ./Source/Identity.Integration.Specs/bin/Release/net11.0/Cratis.Identity.Integration.Specs -notrait "Category=Conformance"

      - name: Release gate - Chronicle-down behaviour
        run: |
          ./Source/Identity.Integration.Specs/bin/Release/net10.0/Cratis.Identity.Integration.Specs -class Cratis.Identity.Integration.for_Revocation.when_chronicle_is_unavailable
          ./Source/Identity.Integration.Specs/bin/Release/net11.0/Cratis.Identity.Integration.Specs -class Cratis.Identity.Integration.for_Revocation.when_chronicle_is_unavailable

      - name: Protocol conformance (RFCs)
        run: |
          ./Source/Identity.Integration.Specs/bin/Release/net10.0/Cratis.Identity.Integration.Specs -trait "Category=Conformance"
          ./Source/Identity.Integration.Specs/bin/Release/net11.0/Cratis.Identity.Integration.Specs -trait "Category=Conformance"

      # CI builds and packs the packages as artifacts only. There is no publish step until the W0 specs (#24, #26, #27) lock.
      - name: Pack NuGet
        run: dotnet pack Identity.slnx --configuration Release --no-build --output Artifacts/NuGet -p:Version=0.0.0-ci.${{ github.run_number }}

      - name: Build and pack npm workspaces
        working-directory: Source/JavaScript
        run: |
          corepack enable
          yarn install --immutable
          yarn workspace @cratis/identity build
          yarn workspace @cratis/identity.react compile
          yarn workspace @cratis/identity.react lint
          yarn workspace @cratis/identity.react test
          mkdir -p ../../Artifacts/npm
          yarn workspace @cratis/identity pack --out ../../../Artifacts/npm/cratis-identity.tgz
          yarn workspace @cratis/identity.react pack --out ../../../Artifacts/npm/cratis-identity.react.tgz

      - name: Upload packages
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: Artifacts/
          retention-days: 7
          if-no-files-found: error
