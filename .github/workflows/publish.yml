name: Publish

# Keep every pending release in order: release-action releases one merged pull request per run, and the
# default concurrency keeps only one pending run and cancels the others (Cratis/Workflows#162).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string

  # Releasing on push to main, not on the pull_request closed event: a push always runs with a full-permission
  # token, and the release action finds the merged pull request and its release-intent label from the commit.
  # Only main releases, so stacking one pull request on another never publishes from a branch in review.
  push:
    branches:
      - main
    paths:
      - "Source/**"
      - "Docker/**"
      - "global.json"
      - "Directory.*.props"
      - "Directory.*.targets"

permissions:
  contents: read

jobs:
  release:
    # Only main releases, also for a manual dispatch from another branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      issues: write
      contents: write
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  # Publication stays opt-in: set the repository variable CRATIS_ID_IMAGE_PUBLISH_ENABLED=true once the final
  # image name is confirmed (see Documentation/deployment/cratis-id-image-contract.md). The image carries no
  # hostname or secret; deployment pins the published digest.
  publish-image:
    name: Publish hosted-shared image
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.publish == 'true' && vars.CRATIS_ID_IMAGE_PUBLISH_ENABLED == 'true'
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Sign in to GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/cratis/id:${VERSION}"
            echo "ghcr.io/cratis/id:${GITHUB_SHA}"
            if [ "${PRERELEASE}" != "true" ]; then
              echo "ghcr.io/cratis/id:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Docker/Dockerfile
          target: cratis-id
          build-args: HOST=Identity.CratisId
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Report the published digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published ghcr.io/cratis/id@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  verify-published:
    # A merge that publishes nothing is the failure mode that silently costs a release: the release job
    # succeeds, every publish job is skipped for want of should-publish, and the run reports green. Fail for the
    # reasons that mean something went wrong; publishing nothing is correct for no-release, direct pushes and
    # re-runs.
    if: always() && needs.release.result == 'success' && contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason)
    runs-on: ${{ vars.RUNNER_GATE || 'cratis-arc-small' }}
    timeout-minutes: 5
    needs: [release]
    steps:
      - name: Report that nothing was published
        env:
          REASON: ${{ needs.release.outputs.reason }}
        run: |
          echo "::error::Nothing was published and no release was cut (reason: ${REASON}). Add exactly one of major, minor or patch to the merged pull request and re-run this workflow."
          exit 1
