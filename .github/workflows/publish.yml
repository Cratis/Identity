name: Publish

# Keep every pending release in order: release-action releases one merged pull request per run, and the
# default concurrency keeps only one pending run and cancels the others (Cratis/Workflows#162).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  queue: max

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
        default: '0.0.0'
        type: string
      release-notes:
        description: 'Release notes'
        required: true
        default: 'No release notes'
        type: string

  # Releasing on push to main, not on the pull_request closed event: a push always runs with a full-permission
  # token, and the release action finds the merged pull request and its release-intent label from the commit.
  # Only main releases, so stacking one pull request on another never publishes from a branch in review.
  push:
    branches:
      - main
    paths:
      - "Source/**"
      - "Docker/**"
      - "global.json"
      - "Directory.*.props"
      - "Directory.*.targets"
      # A change to how releases are cut releases too, so a fix to this workflow takes effect with its own merge.
      - ".github/workflows/publish.yml"

permissions:
  contents: read

jobs:
  release:
    # Only main releases, also for a manual dispatch from another branch.
    if: github.ref == 'refs/heads/main'
    permissions:
      issues: write
      contents: write
      # The release action looks up the merged pull request for the pushed commit; without this the lookup
      # returns 403, the action decides no-pull-request and nothing is released.
      pull-requests: read
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    timeout-minutes: 30
    outputs:
      version: ${{ steps.release.outputs.version }}
      publish: ${{ steps.release.outputs.should-publish }}
      prerelease: ${{ steps.release.outputs.prerelease }}
      reason: ${{ steps.release.outputs.reason }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Release
        id: release
        uses: cratis/release-action@v1
        with:
          version: ${{ github.event.inputs.version }}
          release-notes: ${{ github.event.inputs.release-notes }}

  # Every release publishes the hosted-shared image (see Documentation/deployment/cratis-id-image-contract.md).
  # The image carries no hostname or secret; deployment pins the published digest.
  publish-image:
    name: Publish hosted-shared image
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.publish == 'true'
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Sign in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image tags
        id: tags
        env:
          VERSION: ${{ needs.release.outputs.version }}
          PRERELEASE: ${{ needs.release.outputs.prerelease }}
        run: |
          {
            echo "tags<<EOF"
            echo "ghcr.io/cratis/id:${VERSION}"
            echo "ghcr.io/cratis/id:${GITHUB_SHA}"
            if [ "${PRERELEASE}" != "true" ]; then
              echo "ghcr.io/cratis/id:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish
        id: push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: Docker/Dockerfile
          target: cratis-id
          build-args: HOST=Identity.CratisId
          push: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Report the published digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: echo "Published ghcr.io/cratis/id@${DIGEST}" >> "$GITHUB_STEP_SUMMARY"

  # Cratis.Identity.Contracts, pushed with the organization's NuGet API key. Trusted publishing would avoid the key, but
  # needs a policy on nuget.org bound to this workflow; switch to it by restoring the NuGet/login step once that exists.
  # Consumers such as Cratis Direct subscribe to the published contracts with this package.
  publish-nuget:
    name: Pack and push Cratis.Identity.Contracts
    needs: release
    if: github.ref == 'refs/heads/main' && needs.release.outputs.publish == 'true'
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Pack Identity.Contracts
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: dotnet pack Source/Identity.Contracts --configuration Release -p:Version="${VERSION}" -o ./Artifacts/NuGet
      - name: Push NuGet package
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
        run: dotnet nuget push --skip-duplicate './Artifacts/NuGet/*.nupkg' --timeout 900 --api-key "${NUGET_API_KEY}" --source https://api.nuget.org/v3/index.json

  verify-published:
    # A merge that publishes nothing is the failure mode that silently costs a release: the release job
    # succeeds, every publish job is skipped for want of should-publish, and the run reports green. Fail for the
    # reasons that mean something went wrong; publishing nothing is correct for no-release and re-runs. A push to
    # main that finds no pull request also fails: releases come from merged pull requests, so it means either the
    # lookup failed (for example for want of permission) or a change reached main without one. To release a
    # direct push on purpose, dispatch this workflow with an explicit version; re-running it will not help.
    if: >-
      always() && needs.release.result == 'success' && (
        contains(fromJSON('["no-label", "error"]'), needs.release.outputs.reason) ||
        (github.event_name == 'push' && needs.release.outputs.reason == 'no-pull-request'))
    runs-on: ${{ vars.RUNNER_GATE || 'cratis-arc-small' }}
    timeout-minutes: 5
    needs: [release]
    steps:
      - name: Report that nothing was published
        env:
          REASON: ${{ needs.release.outputs.reason }}
        run: |
          if [ "${REASON}" = "no-pull-request" ]; then
            echo "::error::Nothing was published and no release was cut: no merged pull request was found for this commit. Check the release job's pull-requests permission and the release step log, then re-run this workflow."
          else
            echo "::error::Nothing was published and no release was cut (reason: ${REASON}). Add exactly one of major, minor or patch to the merged pull request and re-run this workflow."
          fi
          exit 1
