name: Runner Guard

# Private repositories must never schedule work on GitHub-hosted runners.
# Every hosted job bills Actions minutes (one-minute minimum per job, Windows 2x,
# macOS 10x) against the organization's fixed monthly quota. In October 2026
# overlooked hosted jobs drained the entire quota in four days.

# Called from pull-requests.yml; the PR triggers and path filters live there.
on:
  workflow_dispatch:
  workflow_call:
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: runner-guard-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  no-hosted-runners:
    name: No GitHub-hosted runners
    # jobWeight: light
    runs-on: ${{ vars.RUNNER_GATE || 'cratis-arc-small' }}
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Every runs-on resolves to cratis-arc
        shell: bash
        run: |
          set -euo pipefail
          offenders=$(grep -rn --include='*.yml' --include='*.yaml' -E 'runs-on:.*((ubuntu|windows|macos)-[a-z0-9.]+)' .github/workflows/ \
            | grep -vE ':[0-9]+:[[:space:]]*#' || true)
          if [ -n "$offenders" ]; then
            echo "::error::Hosted-runner references found - private repos must resolve to cratis-arc"
            echo "$offenders"
            echo ""
            echo "Use: runs-on: \${{ vars.RUNNER_FORCE || 'cratis-arc' }} (heavy jobs)"
            echo " or: runs-on: \${{ vars.RUNNER_GATE || 'cratis-arc-small' }} (light guards - script and API checks, no Docker or real build)"
            echo "If cratis-arc is down, set the repo variable - do not edit workflows."
            exit 1
          fi
          echo "OK: all runners resolve to cratis-arc."
      - name: Every artifact upload sets retention-days
        shell: bash
        run: |
          set -euo pipefail
          offenders=""
          while IFS= read -r f; do
            grep -q 'retention-days' "$f" || offenders="${offenders} ${f}"
          done < <(grep -rl --include='*.yml' 'actions/upload-artifact' .github/workflows/ 2>/dev/null || true)
          if [ -n "$offenders" ]; then
            echo "::error::Artifact uploads without retention-days found - the default is 90 days and bills storage"
            for f in $offenders; do echo "  $f"; done
            exit 1
          fi
          echo "OK: all artifact uploads set retention-days."
