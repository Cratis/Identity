name: Package authorization vectors

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: authorization-vectors-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: Package reviewed vector artifact
    runs-on: ${{ vars.RUNNER_GATE || 'cratis-arc-small' }}
    timeout-minutes: 5
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22.14.0'
      - name: Check vector baseline immutability
        run: node scripts/check-vector-baseline-immutability.mjs
      - name: Check deterministic archive format and baseline protection
        run: node --test scripts/package-authorization-vectors.test.mjs scripts/check-vector-baseline-immutability.test.mjs
      - name: Package vectors and checksum
        run: node scripts/package-authorization-vectors.mjs .ai-work/identity-134/artifacts
      - name: Verify checksum and archive
        working-directory: .ai-work/identity-134/artifacts
        run: |
          sha256sum --check ./*.sha256
          for archive in ./*.tar.gz; do tar -tzf "$archive"; done
      - name: Upload for release-owner review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: arc-mcp-authorization-v1-vectors
          path: |
            .ai-work/identity-134/artifacts/*.tar.gz
            .ai-work/identity-134/artifacts/*.sha256
          if-no-files-found: error
          retention-days: 30
