name: OpenIddict compatibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compatibility:
    name: Candidate build and protocol conformance
    runs-on: ${{ vars.RUNNER_FORCE || 'cratis-arc' }}
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Keep NuGet packages on the scratch volume
        shell: bash
        run: echo "NUGET_PACKAGES=$(dirname "$GITHUB_WORKSPACE")/.nuget-packages" >> "$GITHUB_ENV"

      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/dotnet
        with:
          global-json-file: global.json
          dotnet-version: |
            10.0.x
            11.0.x

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x

      # Change only this disposable checkout. Never update, commit or publish the central version pin.
      - name: Select and apply candidate version
        env:
          OPENIDDICT_CANDIDATE_VERSION: ${{ vars.OPENIDDICT_CANDIDATE_VERSION }}
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          async function main() {
            let version = process.env.OPENIDDICT_CANDIDATE_VERSION;
            if (!version) {
              const response = await fetch('https://api.nuget.org/v3-flatcontainer/openiddict.aspnetcore/index.json');
              if (!response.ok) throw new Error(`NuGet version lookup failed: ${response.status}`);
              const { versions } = await response.json();
              version = versions.filter(value => !value.includes('-')).at(-1);
            }
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(version)) throw new Error('Invalid candidate version');
            const path = 'Directory.Packages.props';
            const current = fs.readFileSync(path, 'utf8');
            const candidate = current.replace(/(<PackageVersion Include="OpenIddict\.[^"]+" Version=")[^"]+("\s*\/>)/g, (_, prefix, suffix) => `${prefix}${version}${suffix}`);
            fs.writeFileSync(path, candidate);
            console.log(`Testing OpenIddict ${version}; repository pin remains unchanged.`);
          }
          main().catch(error => { console.error(error); process.exitCode = 1; });
          NODE

      - name: Build candidate (Release, zero warnings)
        run: dotnet build Identity.slnx --configuration Release -p:CratisProxiesOutputPath=

      - name: Unit specs
        run: ./Source/Identity.Specs/bin/Release/net11.0/Cratis.Identity.Specs

      - name: Protocol conformance (RFCs)
        run: ./Source/Identity.Integration.Specs/bin/Release/net11.0/Cratis.Identity.Integration.Specs -trait "Category=Conformance"
